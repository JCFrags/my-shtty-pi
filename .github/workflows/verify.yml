name: Verify supported architecture

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run verify
      - name: Verify preserved Chrono corrective package
        run: node scripts/verify-chrono-v3-baseline.mjs --allow-missing-live --static-only
      - name: Verify separate historical capture
        run: npm run verify:history
