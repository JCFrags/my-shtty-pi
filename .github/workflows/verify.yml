name: Verify deployed baseline

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch all repository refs
        run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify public repository content boundary
        run: >-
          node scripts/verify-chrono-v3-privacy.mjs
          --self-test --event-scope --require-public-review
          --repository "JCFrags/my-shtty-pi"
          --ci-event "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck ChronoCompact
        run: npm --prefix packages/pi-chrono-compaction run typecheck

  unit-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and integration tests
        run: npm --prefix packages/pi-chrono-compaction test

  determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic generator and report schema
        working-directory: packages/pi-chrono-compaction
        run: |
          rm -rf dist-test
          npx tsc -p tsconfig.test-build.json
          node --test --test-concurrency=1 dist-test/test/synthetic-session.test.js dist-test/test/benchmark-harness.test.js

  fixed-heap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        heap: [512, 1024]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixed-heap scale and fault safety
        run: npm --prefix packages/pi-chrono-compaction run test:fixed-heap -- --heaps ${{ matrix.heap }}

  build-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0, fetch-tags: true, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generated build consistency
        run: |
          npm --prefix packages/pi-chrono-compaction run build
          git diff --exit-code -- packages/pi-chrono-compaction/dist

  root-verification:
    needs: [publication-scan, typecheck, unit-integration, determinism, fixed-heap, build-consistency]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch all repository refs
        run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify frozen ChronoCompact baseline
        run: node scripts/verify-chrono-v3-baseline.mjs --allow-missing-live --static-only
      - name: Verify correction verifier tests
        run: node --test --test-concurrency=1 scripts/test/verify-chrono-v3-baseline.test.mjs scripts/test/verify-chrono-v3-privacy.test.mjs
      - name: Verify complete repository root and ignored dependency-tree fixture
        run: |
          fixture=packages/files-ui/node_modules/verifier-regression
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture"
          printf '{"name":"ignored-verifier-regression"}\n' > "$fixture/package.json"
          printf '{"compilerOptions":{}}\n' > "$fixture/tsconfig.json"
          npm run verify
