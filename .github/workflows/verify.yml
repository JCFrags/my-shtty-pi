name: Verify deployed baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify with an ignored dependency-tree fixture
        run: |
          fixture=packages/files-ui/node_modules/verifier-regression
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture"
          printf '{"name":"ignored-verifier-regression"}\n' > "$fixture/package.json"
          printf '{"compilerOptions":{}}\n' > "$fixture/tsconfig.json"
          npm run verify
