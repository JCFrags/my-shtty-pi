name: Verify supported architecture

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

# Replace only obsolete runs of this workflow for the same PR. Main, manual,
# scheduled, and release evidence never share a cancellation group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      browser: ${{ steps.scope.outputs.browser }}
      products: ${{ steps.scope.outputs.products }}
      lsp: ${{ steps.scope.outputs.lsp }}
      lsp_state: ${{ steps.scope.outputs.lsp_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Select verification scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          REF: ${{ github.ref }}
        run: node scripts/ci-scope.mjs

  verify-repository:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.mode != 'lsp' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Prepare verified Chrono native build headers
        if: needs.scope.outputs.mode == 'full'
        run: |
          npm --prefix packages/pi-chrono-compaction ci --ignore-scripts --no-audit --no-fund
          node packages/pi-chrono-compaction/node_modules/node-gyp/bin/node-gyp.js install --target=24.18.0 --devdir="$RUNNER_TEMP/chrono-node-headers" --ensure
          echo "CHRONO_CATALOG_NODE_HEADERS=$RUNNER_TEMP/chrono-node-headers/24.18.0" >> "$GITHUB_ENV"
      - if: needs.scope.outputs.mode == 'full'
        run: npm run verify
      - name: Verify shared repository invariants once, without installs or builds
        if: needs.scope.outputs.mode == 'affected' || needs.scope.outputs.mode == 'docs'
        run: npm run verify:static
      - name: Verify separate historical capture
        if: needs.scope.outputs.mode != 'docs'
        run: npm run verify:history

  verify-products:
    needs: [scope, verify-repository]
    if: needs.scope.result == 'success' && needs.verify-repository.result == 'success' && needs.scope.outputs.mode == 'affected' && needs.scope.outputs.products != '[]' && github.event_name != 'push'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        product: ${{ fromJSON(needs.scope.outputs.products || '[]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Prepare verified Chrono native build headers
        if: matrix.product == 'pi-chrono-compaction'
        run: |
          npm --prefix packages/pi-chrono-compaction ci --ignore-scripts --no-audit --no-fund
          node packages/pi-chrono-compaction/node_modules/node-gyp/bin/node-gyp.js install --target=24.18.0 --devdir="$RUNNER_TEMP/chrono-node-headers" --ensure
          echo "CHRONO_CATALOG_NODE_HEADERS=$RUNNER_TEMP/chrono-node-headers/24.18.0" >> "$GITHUB_ENV"
      - name: Verify selected product and its existing invariants
        env:
          PRODUCT: ${{ matrix.product }}
        run: npm run verify -- --product "$PRODUCT" --skip-shared-checks

  verify-lsp:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.lsp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Require complete and safe LSP lane inputs
        env:
          LSP_STATE: ${{ needs.scope.outputs.lsp_state }}
        run: |
          if [ "$LSP_STATE" != ready ]; then
            echo "::error::Missing, unsafe, or unmapped LSP lane inputs."
            exit 1
          fi
      - name: Verify only the scoped LSP contract and lifecycle
        run: node scripts/verify-lsp.mjs

  browser-copy:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.scope.outputs.mode == 'full' || (needs.scope.outputs.mode == 'affected' && needs.scope.outputs.browser == 'true' && github.event_name != 'push')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: vendor/terminal-browser/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify locked browser-copy provenance
        run: node scripts/verify-browser-copy.mjs
      - name: Install locked browser-copy workspace
        run: pnpm --dir vendor/terminal-browser install --frozen-lockfile --ignore-scripts
      - name: Build browser-copy workspace
        run: pnpm --dir vendor/terminal-browser -r build
      - name: Typecheck browser-copy integration packages
        run: pnpm --dir vendor/terminal-browser --filter terminal-browser --filter terminal-browser-cli --filter pi-terminal-browser run typecheck
      - name: Test browser-copy integration packages
        run: pnpm --dir vendor/terminal-browser --filter terminal-browser --filter terminal-browser-cli --filter pixel-store --filter pi-terminal-browser run test

  # Keep the required status present, including when a dependency fails or skips.
  verify:
    needs: [scope, verify-repository, verify-products, verify-lsp, browser-copy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected verification checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.scope.outputs.mode }}
          BROWSER: ${{ needs.scope.outputs.browser }}
          PRODUCTS: ${{ needs.scope.outputs.products }}
          LSP: ${{ needs.scope.outputs.lsp }}
          LSP_STATE: ${{ needs.scope.outputs.lsp_state }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          REPOSITORY_RESULT: ${{ needs.verify-repository.result }}
          PRODUCTS_RESULT: ${{ needs.verify-products.result }}
          LSP_RESULT: ${{ needs.verify-lsp.result }}
          BROWSER_RESULT: ${{ needs.browser-copy.result }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const env = process.env;
          assert.equal(env.SCOPE_RESULT, 'success', 'scope');
          assert.ok(['pull_request', 'push', 'workflow_dispatch', 'schedule'].includes(env.EVENT_NAME), 'known event');
          const products = JSON.parse(env.PRODUCTS);
          assert.ok(Array.isArray(products) && products.every(name => typeof name === 'string' && /^[a-z][a-z0-9-]+$/.test(name)));
          assert.equal(new Set(products).size, products.length);
          assert.ok(['true', 'false'].includes(env.BROWSER));
          assert.ok(['true', 'false'].includes(env.LSP));
          assert.ok(['ready', 'legacy', 'invalid'].includes(env.LSP_STATE));
          const lsp = env.MODE === 'lsp' || env.LSP_STATE === 'invalid'
            || (env.LSP_STATE === 'ready' && (env.MODE === 'full' || products.includes('grounded-tools')));
          assert.equal(env.LSP, String(lsp), 'LSP selection');
          if (lsp) assert.equal(env.LSP_STATE, 'ready', 'complete and safe LSP inputs');
          assert.equal(env.LSP_RESULT, lsp ? 'success' : 'skipped', 'selected LSP');
          assert.equal(env.REPOSITORY_RESULT, env.MODE === 'lsp' ? 'skipped' : 'success', 'repository invariants');
          if (env.MODE === 'lsp') {
            assert.deepEqual(products, []);
            assert.equal(env.BROWSER, 'false');
            assert.equal(env.PRODUCTS_RESULT, 'skipped');
            assert.equal(env.BROWSER_RESULT, 'skipped');
          } else if (env.MODE === 'full') {
            assert.deepEqual(products, []);
            assert.equal(env.BROWSER, 'true');
            assert.equal(env.PRODUCTS_RESULT, 'skipped');
            assert.equal(env.BROWSER_RESULT, 'success');
          } else if (env.MODE === 'docs') {
            assert.deepEqual(products, []);
            assert.equal(env.BROWSER, 'false');
            assert.equal(env.PRODUCTS_RESULT, 'skipped');
            assert.equal(env.BROWSER_RESULT, 'skipped');
          } else {
            assert.equal(env.MODE, 'affected', 'known verification mode');
            assert.ok(products.length || env.BROWSER === 'true', 'nonempty selection');
            // Strict fresh-base PR checks already validated routine merges.
            // Main still requires static/history checks and selected LSP checks.
            const productBuilds = env.EVENT_NAME !== 'push';
            assert.equal(env.PRODUCTS_RESULT, productBuilds && products.length ? 'success' : 'skipped', 'selected products');
            assert.equal(env.BROWSER_RESULT, productBuilds && env.BROWSER === 'true' ? 'success' : 'skipped', 'selected browser');
          }
          console.log(`Passed ${env.MODE} verification.`);
          JS
