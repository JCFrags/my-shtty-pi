name: Repository integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: test "$(node --version)" = "v22.19.0" && test "$(npm --version)" = "10.9.3"
      - run: npm run check
      - run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
