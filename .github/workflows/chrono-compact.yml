name: ChronoCompact

on:
  pull_request:
    paths:
      - "packages/chrono-compact/**"
      - "docs/package-catalog.json"
      - "docs/package-status.md"
      - "docs/roadmap.md"
      - "CHANGELOG.md"
      - ".github/workflows/chrono-compact.yml"
  push:
    branches:
      - main
    paths:
      - "packages/chrono-compact/**"
      - "docs/package-catalog.json"
      - "docs/package-status.md"
      - "docs/roadmap.md"
      - "CHANGELOG.md"
      - ".github/workflows/chrono-compact.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/chrono-compact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/chrono-compact/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack:check
