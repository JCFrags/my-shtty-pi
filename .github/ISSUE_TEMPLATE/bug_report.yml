name: Bug report
description: Report a reproducible problem with a package or repository process.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, cookies, private keys, session files, prompts, private endpoints, or private project content. Sanitize logs. For security concerns, read [SECURITY.md](https://github.com/JCFrags/my-shtty-pi/blob/main/SECURITY.md).
  - type: input
    id: package
    attributes:
      label: Affected package
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exact version or commit
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets and private project content before posting.
