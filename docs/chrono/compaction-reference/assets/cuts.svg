<svg xmlns="http://www.w3.org/2000/svg" class="chrono-diagram" width="1040" height="646" viewBox="0 0 1040 646" role="img" aria-labelledby="cuts-title cuts-desc">
<title id="cuts-title">Deterministic cuts with an optional milestone hint</title>
<desc id="cuts-desc">Approved implementation baseline; implementation in progress. Code owns token fit and complete tool-call/result units. A successful current-interval Context Kit milestone-completed/next-milestone-started transition can suggest H. Other typed transitions or weaker position hints can also suggest candidates. A checkpoint is saved position, a weak boundary hint, not completion. Code validates S ≤ H ≤ R ≤ E, with no gap or overlap. The hint never overrides token fit or complete call/result units.</desc>
<style>
.chrono-diagram { --d-bg: var(--diagram-bg, #f5f3f0); --d-box: var(--diagram-box, #e9edf0); --d-line: var(--diagram-line, #7c8791); --d-ink: var(--diagram-text, #252f3d); --d-muted: var(--diagram-muted, #555f69); --d-a: var(--diagram-a, #dbe8ef); --d-b: var(--diagram-b, #e7e7d8); --d-c: var(--diagram-c, #edddd5); }
@media (prefers-color-scheme: dark) { .chrono-diagram { --d-bg: var(--diagram-bg, #212730); --d-box: var(--diagram-box, #2b3642); --d-line: var(--diagram-line, #9daab6); --d-ink: var(--diagram-text, #ebe7e4); --d-muted: var(--diagram-muted, #b2bbc4); --d-a: var(--diagram-a, #294553); --d-b: var(--diagram-b, #414536); --d-c: var(--diagram-c, #513b34); } }
.d-bg { fill: var(--d-bg); }
.d-box, .d-a, .d-b, .d-c { fill: var(--d-box); stroke: var(--d-line); stroke-width: 1.5; }
.d-a { fill: var(--d-a); } .d-b { fill: var(--d-b); } .d-c { fill: var(--d-c); }
.d-outline { fill: none; stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 6 5; }
.d-line { fill: none; stroke: var(--d-line); stroke-width: 2; }
.d-dash { stroke-dasharray: 6 5; }
.d-arrow { fill: var(--d-line); }
.d-title, .d-label, .d-copy, .d-small, .d-cut { fill: var(--d-ink); font-family: ui-sans-serif, system-ui, sans-serif; }
.d-title { font-size: 25px; font-weight: 600; }
.d-label { font-size: 20px; font-weight: 600; }
.d-copy { font-size: 19px; }
.d-small { font-size: 18px; fill: var(--d-muted); }
.d-cut { font-size: 20px; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
<defs><marker id="cuts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="d-arrow"/></marker></defs>
<rect x="0" y="0" width="1040" height="646" rx="3" class="d-bg"/>
<text x="28" y="40" class="d-title"><tspan x="28" dy="0">Deterministic cuts with an optional milestone hint</tspan></text>
<text x="28" y="70" class="d-small"><tspan x="28" dy="0">Approved baseline. Implementation in progress.</tspan></text>
<rect x="28" y="110" width="470" height="180" rx="3" class="d-box"/><text x="46" y="141" class="d-label"><tspan x="46" dy="0">Code chooses cuts</tspan></text><text x="46" y="171" class="d-copy"><tspan x="46" dy="0">Token fit for the full packet</tspan><tspan x="46" dy="26">Complete tool-call/result units</tspan><tspan x="46" dy="26">Never split a call from its result</tspan></text>
<rect x="548" y="110" width="464" height="180" rx="3" class="d-box"/><text x="566" y="141" class="d-label"><tspan x="566" dy="0">Context Kit hint, current interval</tspan></text><text x="566" y="171" class="d-copy"><tspan x="566" dy="0">Successful milestone completed</tspan><tspan x="566" dy="26">then next milestone started</tspan><tspan x="566" dy="26">may suggest H</tspan></text>
<path d="M548 200 H498" class="d-line" marker-end="url(#cuts-arrow)"/>
<rect x="548" y="318" width="464" height="106" rx="3" class="d-box"/><text x="566" y="349" class="d-label"><tspan x="566" dy="0">Checkpoint: saved position only</tspan></text><text x="566" y="379" class="d-copy"><tspan x="566" dy="0">Weak boundary hint, not completion</tspan></text>
<text x="28" y="351" class="d-small"><tspan x="28" dy="0">Code validates any hint</tspan></text>
<text x="56" y="461" class="d-cut"><tspan x="56" dy="0">S</tspan></text>
<text x="348" y="461" class="d-cut"><tspan x="348" dy="0">H</tspan></text>
<text x="744" y="461" class="d-cut"><tspan x="744" dy="0">R</tspan></text>
<text x="972" y="461" class="d-cut"><tspan x="972" dy="0">E</tspan></text>
<rect x="56" y="480" width="292" height="88" rx="3" class="d-a"/><text x="74" y="511" class="d-label"><tspan x="74" dy="0">A: [S,H)</tspan></text>
<rect x="348" y="480" width="396" height="88" rx="3" class="d-b"/><text x="366" y="511" class="d-label"><tspan x="366" dy="0">B: [H,R)</tspan></text>
<rect x="744" y="480" width="244" height="88" rx="3" class="d-c"/><text x="762" y="511" class="d-label"><tspan x="762" dy="0">C: [R,E)</tspan></text>
<text x="56" y="612" class="d-cut"><tspan x="56" dy="0">S ≤ H ≤ R ≤ E. H must be ≤ R. No gap. No overlap.</tspan></text>
</svg>
